name: update-rates

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch from Kraken
        run: python3 rates.py update --coins BTC,ETH,SOL,USDT,XRP,TRX,USDC,DOGE,USD

      - name: Validate
        run: |
          python3 - <<'PYEOF'
          import json
          d = json.load(open("rates.json"))
          c = [k for k in d if not k.startswith("_")]
          assert len(c) >= 9, "通貨数が不足: %d" % len(c)
          empty = [k for k in c if not d[k]]
          assert not empty, "空の通貨あり: %s" % empty
          print("検証OK:", {k: len(d[k]) for k in sorted(c)})
          PYEOF

      - name: Commit if changed
        run: |
          git config user.name  "senba-rates bot"
          git config user.email "actions@github.com"
          if git diff --quiet -- rates.json; then
            echo "変更なし。コミットをスキップします。"
          else
            git add rates.json
            git commit -m "rates: $(date -u '+%Y-%m-%d') 自動更新"
            git push
          fi
